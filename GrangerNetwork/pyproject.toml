[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "granger-network-prototype"
version = "0.2.0"
description = "Experimental private .granger namespace and rendezvous transport"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=44",
]

[project.scripts]
granger-host = "granger_network.host:main"
granger-client = "granger_network.client:main"
granger-rendezvous = "granger_network.rendezvous:main"
granger-browser-gateway = "granger_network.browser_gateway:main"

[tool.setuptools.packages.find]
where = ["src"]
